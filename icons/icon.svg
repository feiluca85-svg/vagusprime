<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#061325" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1f293d" stroke-width="4" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-dasharray="16 12" opacity="0.4" />
  
  <!-- Bio Ring Glow -->
  <circle cx="256" cy="256" r="130" fill="#10b981" fill-opacity="0.06" stroke="url(#glowGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Central Vagus / Heartbeat Wave -->
  <path d="M 120 256 L 180 256 L 210 190 L 240 330 L 275 160 L 310 295 L 335 256 L 392 256" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Core Nucleus -->
  <circle cx="256" cy="256" r="14" fill="#ffffff" filter="url(#glow)" />
</svg>
